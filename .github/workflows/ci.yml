name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python checks
    # PRs, manual runs and direct pushes still run the full CI.
    # A regular GitHub merge commit was already tested by its PR workflow.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Docker build definition
        run: docker buildx build --check .
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check 'numpy<2'
      - name: Compile application and tests
        run: python -m compileall -q server.py search-cli.py search_core.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: parsec-search:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
