name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the latest semantic version should be incremented?"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

concurrency:
  group: parsec-search-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish stable release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch and calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases may only be created from main."
            exit 1
          fi

          LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
          fi

          if [[ ! "$CURRENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Latest release tag '$LATEST_TAG' is not a valid stable semantic version."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unsupported version increment: $BUMP"
              exit 1
              ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Release version"
            echo
            echo "- Previous version: $CURRENT_VERSION"
            echo "- Increment: $BUMP"
            echo "- New version: $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Git tag v$VERSION already exists."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check 'numpy<2'

      - name: Compile application and tests
        run: python -m compileall -q server.py search-cli.py search_core.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "parsec-search v$VERSION" --generate-notes
