name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without a leading v (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: parsec-search-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish stable release
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch and validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases may only be created from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be semantic X.Y.Z without leading zeroes or a leading v."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Git tag v$VERSION already exists."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile application and tests
        run: python -m compileall -q server.py search-cli.py search_core.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx build --push \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:stable" \
            .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "parsec-search v$VERSION" --generate-notes
