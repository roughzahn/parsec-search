name: parsec-search

services:
  parsec-search:
    image: parsec-search:latest
    build:
      context: .
    container_name: parsec-search
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8000"
    environment:
      PARSEC_SEARCH_DATA_DIR: /data
      PARSEC_SEARCH_MODEL_DIR: /models
    volumes:
      - "${PARSEC_SEARCH_DATA_PATH:-C:/music-ai/search-data}:/data"
      - "${PARSEC_SEARCH_MODEL_PATH:-C:/music-ai/model-cache}:/models"
    networks:
      - music-ai-network

networks:
  music-ai-network:
    external: true
