name: parsec-search

services:
  parsec-search:
    image: parsec-search:latest
    build:
      context: .
    container_name: parsec-search
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8000"
    environment:
      TZ: Europe/Berlin
      PARSEC_SEARCH_UI_ENABLED: ${PARSEC_SEARCH_UI_ENABLED:-true}
      PARSEC_SEARCH_DATA_DIR: /data
      PARSEC_SEARCH_MODEL_DIR: /models
      PARSEC_SEARCH_INTERNAL_TOKEN: ${PARSEC_SEARCH_INTERNAL_TOKEN:-}
      PARSEC_SEARCH_EMBEDDING_MODEL_ID: ${PARSEC_SEARCH_EMBEDDING_MODEL_ID:-laion-clap-630k-audioset-v1}
      PARSEC_SEARCH_EMBEDDING_VERSION: ${PARSEC_SEARCH_EMBEDDING_VERSION:-1}
      PARSEC_GATEWAY_BASE_URL: ${PARSEC_GATEWAY_BASE_URL:-http://127.0.0.1:8766}
    volumes:
      - "${PARSEC_SEARCH_DATA_PATH:-C:/parsec/search-data}:/data"
      - "${PARSEC_SEARCH_MODEL_PATH:-C:/parsec/models}:/models"
    networks:
      - music-ai-network

networks:
  music-ai-network:
    external: true
